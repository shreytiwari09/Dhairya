# Render Blueprint: one free web service that serves the demo page and the live agent.
# New + > Blueprint > pick this repository. Then paste GNANI_API_KEY when asked.
services:
  - type: web
    name: dhairya-live
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GNANI_API_KEY
        sync: false # entered in the dashboard, never stored in the repository
      - key: LIVE_ALLOWED_ORIGINS
        value: https://shreytiwari09.github.io
      # Generous for a panel of judges, capped so credits cannot run away.
      - key: LIVE_PER_IP_HOUR
        value: "15"
      - key: LIVE_PER_IP_DAY
        value: "40"
      - key: LIVE_MAX_CONCURRENT
        value: "3"
      - key: LIVE_DAILY_TOTAL
        value: "400"
