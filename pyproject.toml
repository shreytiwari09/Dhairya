[project]
name = "dhairya"
version = "0.1.0"
description = "Dhairya: a turn-taking layer for Gnani Prisma realtime STT that lets callers finish their number."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Smart Turn baseline: an outside open model (pipecat-ai/smart-turn, BSD-2-Clause), run locally.
baselines = ["onnxruntime>=1.18", "transformers>=4.40"]

[tool.uv]
default-groups = ["dev", "baselines"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhairya"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Hidden folders hold local tooling (third-party code); never lint or reformat them.
extend-exclude = ["*.md", ".*", "demo", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Devanagari lexicon lines are long by nature.
# The probe and the report writer build Markdown from long table strings.
per-file-ignores = { "src/dhairya/entities/lexicon_hi_en.py" = ["E501"], "scripts/probe.py" = ["E501"], "src/dhairya/bench/report.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
